# Put dist/ contents in this document root; configure your HTTPS certificate separately.
server {
    listen 80;
    server_name _;
    root /var/www/focus-lens;
    index index.html;
    include /etc/nginx/mime.types;
    types { application/wasm wasm; text/javascript mjs; }
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'" always;
    gzip on;
    gzip_types text/javascript application/javascript application/json application/wasm text/css;
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
